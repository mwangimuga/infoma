<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | INFOMA</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            green: '#4CAF50',
                            red: '#EF4444',
                            charcoal: '#111111',
                            offwhite: '#F8F9FA',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    letterSpacing: {
                        premium: '-0.02em',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply font-sans bg-brand-offwhite text-brand-charcoal transition-colors duration-300 tracking-premium antialiased;
            }
            .dark body {
                @apply bg-brand-charcoal text-brand-offwhite;
            }
            h1, h2, h3, h4 {
                @apply font-bold tracking-premium text-brand-charcoal dark:text-white;
            }
        }
        @layer components {
            .glass-nav {
                @apply fixed top-4 left-1/2 -translate-x-1/2 w-[95%] max-w-7xl z-50 rounded-2xl border border-black/5 bg-white/70 backdrop-blur-xl shadow-sm transition-all duration-300;
            }
            .dark .glass-nav {
                @apply bg-black/50 border-white/5;
            }
            .nav-link {
                @apply text-[13px] font-medium opacity-60 hover:opacity-100 transition-opacity uppercase tracking-widest;
            }
            .nav-link.active {
                @apply opacity-100 relative;
            }
            .nav-link.active::after {
                @apply content-[''] absolute -bottom-1 left-0 w-full h-[2px] bg-brand-red;
            }
            .form-input {
                @apply w-full px-6 py-4 rounded-xl border border-black/5 bg-white dark:bg-white/5 dark:border-white/10 focus:outline-none focus:border-brand-green transition-all;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="glass-nav px-8 py-4 flex items-center justify-between">
            <img src="assets/Infoma Logo white.svg" alt="Infoma Logo" class="h-24 object-contain dark:hidden" />
            <img src="assets/Infoma Logo black.svg" alt="Infoma Logo" class="h-24 object-contain hidden dark:block" />
        
        <ul class="hidden lg:flex items-center gap-10">
            <li><a href="index.html" class="nav-link">Home</a></li>
            <li><a href="it-services.html" class="nav-link">IT & Tech</a></li>
            <li><a href="digital-services.html" class="nav-link">Digital Media</a></li>
            <li><a href="contact.html" class="nav-link active">Contact</a></li>
        </ul>

        <div class="flex items-center gap-6">
            <button id="theme-toggle" class="p-2 opacity-50 hover:opacity-100 transition-opacity">
                <svg id="theme-toggle-dark-icon" class="hidden w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                <svg id="theme-toggle-light-icon" class="hidden w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
            </button>
        </div>
    </nav>

    <!-- Contact Hero -->
    <header class="pt-48 pb-20 px-8">
        <div class="container mx-auto max-w-4xl text-center">
            <div class="inline-block px-3 py-1 mb-8 text-[10px] font-bold tracking-widest uppercase border-b-2 border-brand-red">
                Inquiry
            </div>
            <h1 class="text-5xl md:text-8xl font-bold mb-10 leading-[0.9]">Start Your <span class="text-brand-green">Evolution</span>.</h1>
            <p class="text-lg opacity-50 max-w-2xl mx-auto leading-relaxed">
                Connect with our strategic advisors to discuss your technical architecture or creative vision.
            </p>
        </div>
    </header>

    <!-- Contact Grid -->
    <section class="pb-32 px-8">
        <div class="container mx-auto max-w-6xl">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-24">
                <!-- Info -->
                <div class="space-y-16">
                    <div class="p-12 rounded-[40px] bg-brand-charcoal text-white dark:bg-white/5 border border-white/5 relative overflow-hidden group">
                        <div class="absolute top-0 right-0 p-8 opacity-10 group-hover:opacity-20 transition-opacity">
                            <svg class="w-40 h-40" fill="currentColor" viewBox="0 0 20 20"><path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.07 18 2 12.93 2 6V3z"></path></svg>
                        </div>
                        <h2 class="text-2xl font-bold mb-12 uppercase tracking-widest">Global Ops</h2>
                        <div class="space-y-8 relative z-10">
                            <div>
                                <p class="text-[9px] uppercase tracking-[0.4em] font-bold text-brand-green mb-2">Technical HQ</p>
                                <p class="text-2xl font-light">Nairobi, Kenya</p>
                            </div>
                            <div>
                                <p class="text-[9px] uppercase tracking-[0.4em] font-bold text-brand-green mb-2">Digital Portal</p>
                                <p class="text-2xl font-light">hello@infoma.tech</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Form -->
                <div class="bg-white dark:bg-white/5 p-12 rounded-[40px] border border-black/5 dark:border-white/10 shadow-2xl">
                    <form action="#" method="POST" class="space-y-8">
                        <div class="space-y-3">
                            <label class="text-[9px] uppercase tracking-widest font-bold opacity-30 px-2">Identity</label>
                            <input type="text" class="form-input" placeholder="Full Name" required />
                        </div>
                        <div class="space-y-3">
                            <label class="text-[9px] uppercase tracking-widest font-bold opacity-30 px-2">Portal Address</label>
                            <input type="email" class="form-input" placeholder="email@company.com" required />
                        </div>
                        <div class="space-y-3">
                            <label class="text-[9px] uppercase tracking-widest font-bold opacity-30 px-2">Strategic Interest</label>
                            <select class="form-input appearance-none bg-no-repeat bg-right pr-12">
                                <option>Technical Infrastructure</option>
                                <option>Digital & Creative Branding</option>
                                <option>Strategic Consultation</option>
                            </select>
                        </div>
                        <div class="space-y-3">
                            <label class="text-[9px] uppercase tracking-widest font-bold opacity-30 px-2">Objective</label>
                            <textarea class="form-input h-40 resize-none" placeholder="Describe the mission..."></textarea>
                        </div>
                        <button type="submit" class="w-full py-6 rounded-2xl bg-brand-green text-white font-bold tracking-widest uppercase text-xs shadow-2xl shadow-brand-green/20 hover:scale-[1.01] active:scale-[0.99] transition-all">
                            Submit Inquiry
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-16 border-t border-black/5 dark:border-white/5 opacity-30 text-[9px] uppercase tracking-[0.4em] font-bold text-center">
        <p>&copy; 2026 INFOMA Group | Strategic Division</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
